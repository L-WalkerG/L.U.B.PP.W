<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Up Baku — Games</title>
<meta name="description" content="Games by Level Up Baku, with their privacy policies.">
<link rel="icon" href="CD-PP.W/icon.png">
<style>
:root{--deep:#000f24;--card:#0a2244;--blue:#2fa8ff;--text:#eef4ff;--dim:#a9bddb}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--deep)}
a{color:var(--blue)}
main{max-width:820px;margin:0 auto;padding:40px 20px}
h1{margin:0 0 4px;font-size:34px}
.lead{color:var(--dim);margin:0 0 32px}
.game{display:flex;gap:18px;align-items:center;background:var(--card);border-radius:18px;padding:18px;margin:0 0 16px}
.game img{width:84px;height:84px;border-radius:18px;flex:none}
.game h2{margin:0;font-size:24px}
.game h2 a{color:var(--text);text-decoration:none}
.game p{margin:4px 0}
.links a{margin-right:16px;white-space:nowrap}
footer{margin-top:40px;padding-top:18px;border-top:1px solid #1d3558;color:var(--dim);font-size:15px}
</style>
</head>
<body>
<main>
<h1>Level Up Baku</h1>
<p class="lead">Games made in Baku. Each game has its own page and privacy policy.</p>
<section class="game">
<img src="CD-PP.W/icon.png" alt="Caspian Drift icon">
<div>
<h2><a href="CD-PP.W/">Caspian Drift</a></h2>
<p>Drift through Baku: dodge traffic, outrun the police and race the city circuit.</p>
<p class="links"><a href="CD-PP.W/">Game page</a><a href="CD-PP.W/privacy/">Privacy policy</a></p>
</div>
</section>
<footer>Contact: <a href="mailto:levelupbakugames@gmail.com">levelupbakugames@gmail.com</a><br>© Level Up Baku</footer>
</main>
</body>
</html>
